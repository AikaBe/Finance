sql: "SELECT \r\n    TO_CHAR(t.date, 'YYYY-MM') AS month,\r\n    SUM(t.amount) AS\
  \ total_amount,\r\n    'Database' AS source\r\nFROM trans t\r\nGROUP BY TO_CHAR(t.date,\
  \ 'YYYY-MM')\r\n\r\nUNION ALL\r\n\r\nSELECT \r\n    TO_CHAR(TO_DATE(c.date, 'YYYY-MM-DD'),\
  \ 'YYYY-MM') AS month,\r\n    SUM(c.amount) AS total_amount,\r\n    'CSV' AS source\r\
  \nFROM trans_csv2 c\r\nGROUP BY TO_CHAR(TO_DATE(c.date, 'YYYY-MM-DD'), 'YYYY-MM')\r\
  \n\r\nORDER BY month;\r\n"
