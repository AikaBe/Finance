sql: "SELECT \r\n    d.A2 AS region,\r\n    d.A3 AS district,\r\n    c.client_id AS\
  \ client,\r\n    l.status AS loan_status\r\nFROM client c\r\nLEFT JOIN disp di ON\
  \ c.client_id = di.client_id\r\nLEFT JOIN account a ON di.account_id = a.account_id\r\
  \nLEFT JOIN district d ON a.district_id = d.district_id\r\nLEFT JOIN loan l ON a.account_id\
  \ = l.account_id;\r\n"
