sql: "SELECT\r\n  d.A2   AS district,      -- \u0437\u0430\u043C\u0435\u043D\u0438\
  \u043B d.district_name \u043D\u0430 d.A2\r\n  l.status AS loan_status,\r\n  SUM(l.amount)\
  \ AS total_loan_amount\r\nFROM loan l\r\nLEFT JOIN account a ON l.account_id = a.account_id\r\
  \nLEFT JOIN district d ON a.district_id = d.district_id\r\nWHERE l.status IS NOT\
  \ NULL\r\nGROUP BY d.A2, l.status\r\nORDER BY d.A2, l.status;\r\n"
