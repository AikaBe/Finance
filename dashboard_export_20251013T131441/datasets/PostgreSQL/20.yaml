sql: "SELECT\r\n    EXTRACT(YEAR FROM t.date) AS year,\r\n    AVG(t.amount) AS avg_amount,\r\
  \n    PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY t.amount) AS median_amount,\r\n\
  \    100.0 * (AVG(t.amount) - LAG(AVG(t.amount)) OVER (ORDER BY EXTRACT(YEAR FROM\
  \ t.date))) \r\n           / LAG(AVG(t.amount)) OVER (ORDER BY EXTRACT(YEAR FROM\
  \ t.date)) AS growth_percent,\r\n    AVG(t.amount) - PERCENTILE_CONT(0.5) WITHIN\
  \ GROUP (ORDER BY t.amount) AS difference_avg_median,\r\n    (AVG(t.amount) - MIN(AVG(t.amount))\
  \ OVER ()) / \r\n    (MAX(AVG(t.amount)) OVER () - MIN(AVG(t.amount)) OVER ()) AS\
  \ normalized_avg_amount\r\n\r\nFROM trans t\r\nGROUP BY EXTRACT(YEAR FROM t.date)\r\
  \nORDER BY year;\r\n"
