sql: "SELECT\r\n    t.trans_id,\r\n    t.account_id,\r\n    t.date,\r\n    t.amount,\r\
  \n    t.balance,\r\n    t.type,\r\n    t.operation,\r\n    CASE\r\n        WHEN\
  \ t.amount < 1000 THEN 'Low'\r\n        WHEN t.amount >= 1000 AND t.amount < 5000\
  \ THEN 'Medium'\r\n        WHEN t.amount >= 5000 THEN 'High'\r\n        ELSE 'Unknown'\r\
  \n    END AS amount_category,\r\n    CASE\r\n        WHEN t.balance < 0 THEN 'Negative'\r\
  \n        WHEN t.balance = 0 THEN 'Zero'\r\n        WHEN t.balance > 0 THEN 'Positive'\r\
  \n    END AS balance_category\r\n\r\nFROM trans t\r\nORDER BY t.date;\r\n"
